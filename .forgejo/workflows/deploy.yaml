name: Build and Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the Forgejo UI

jobs:
  deploy:
    runs-on: debian
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq rsync openssh-client sudo

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Build Site
        run: |
          devenv shell -- just build-site

      - name: Deploy to LXC Container via rsync
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BUILD_DIR: ./dist/
          DEPLOY_PATH: /var/www/html/
        run: |
          # Setup SSH access
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

          # Sync built site to deploy host
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ${BUILD_DIR} ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}
