<!doctype html>
<header role="banner" class="site-head">
    <nav class="navbar my-nav navbar-expand-md fixed-top">
        <!-- Brand -->
        <a class="navbar-brand" href="/">
            <img
                src="/assets/branding/logo.png"
                alt="Icon"
                width="30px"
                height="30px"
                class="d-inline-block align-top"
            />
            <img
                src="/assets/branding/name.png"
                alt="Name"
                height="30px"
                class="d-inline-block align-center"
            />
        </a>
        
        <!-- Toggler/collapsible Button -->
        <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#collapsibleNavbar"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Navbar links -->
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav">
                {% for item in navigation.items %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ item.url }}"><b>{{ item.text }}</b></a>
                </li>
                {% endfor %}
            </ul>
        </div>
        
        <!-- Dark Mode Toggle -->
        <!-- Reference: https://github.com/coliff/dark-mode-switch -->
        <div class="custom-control custom-switch">
            <input type="checkbox" class="custom-control-input" id="darkSwitch" />
            <label
                class="custom-control-label"
                for="darkSwitch"
                id="darkSwitchLabel"
            >Dark Mode</label
                      >
        </div>
        <script src="/scripts/dark-mode-switch.min.js"></script>
    </nav>
</header>
