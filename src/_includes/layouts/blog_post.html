<!DOCTYPE html>
{% extends "layouts/base.html" %}
{% from "macros.html" import sectionHeading %}
{% block content %}
<div class="container-fluid px-md-6">
  <h1>{{ title }}</h1>

  <div class="row align-items-center">
    <div class="col-md-3"></div>
    <div class="col-md-6">
      {% if updated %}
        <p>Updated: {{ updated }}</p>
      {% endif %}

      <img
      class="img-fluid mx-auto d-block"
      src="{{ banner }}"
      />

      <hr />

      {{ content | safe }}
    </div>
    <div class="col-md-3"></div>
  </div>
</div>
{% endblock %}
